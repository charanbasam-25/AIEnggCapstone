<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1230" viewBox="0 0 1650 1230" role="img"><title>What is stored, and where</title><desc>SQLite stores reusable questions and operational reports. Learner answers stay in session memory. No learner table or SQL foreign key between questions and runs. Question references are inside JSON payloads. Source and policy govern reuse. Content hashes detect accidental edits, not malicious tampering.</desc><rect width="1650" height="1230" fill="#F5F7FB"/><text x="60" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2457D6">UPSC PRACTICE / SYSTEM DESIGN</text><text x="1445" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">07 OCT 2026</text><text x="60" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#17243B">What is stored, and where</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">SQLite stores reusable questions and operational reports. Learner answers stay in session memory.</text><path d="M 1245,605 L 1245,718 L 550,718 L 550,605" fill="none" stroke="#52647B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><polygon points="550,605 556.0,618.0 544.0,618.0" fill="#52647B"/><path d="M 70,430 L 28,430 L 28,977 L 70,977" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="70,977 57.0,983.0 57.0,971.0" fill="#2457D6"/><rect x="70" y="235" width="700" height="370" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="70" y="235" width="5" height="370" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="94" y="273" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">questions</text><text x="94" y="314" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">id: TEXT PRIMARY KEY</text><text x="94" y="345" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">fingerprint / topic / difficulty / format</text><text x="94" y="376" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">corpus_hash / policy / created_at</text><text x="94" y="407" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">payload: complete PracticeQuestion JSON</text><text x="94" y="438" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">UNIQUE(fingerprint, corpus_hash, policy)</text><text x="94" y="469" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Accepted MCQ, summary, A-D notes, quotes and</text><text x="94" y="500" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">evidence</text><rect x="910" y="235" width="670" height="370" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="910" y="235" width="5" height="370" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="934" y="273" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">runs</text><text x="934" y="314" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">id: TEXT PRIMARY KEY</text><text x="934" y="344" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">created_at: TEXT / payload: JSON text</text><text x="934" y="374" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Request, accepted/reused counts and error class</text><text x="934" y="404" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Stages, calls, tokens and elapsed seconds</text><text x="934" y="434" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Retrieval rankings and checked evidence packets</text><text x="934" y="464" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">question_records: slot, origin and question_id</text><rect x="70" y="865" width="700" height="225" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="70" y="865" width="5" height="225" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="94" y="903" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Streamlit server session</text><text x="94" y="944" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Active set and learner choices</text><text x="94" y="975" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Python score and latest 20 completed sets</text><text x="94" y="1006" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">No learner choices sent to the model</text><text x="94" y="1037" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Browser refresh/restart can lose history</text><rect x="910" y="865" width="670" height="225" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="910" y="865" width="5" height="225" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="934" y="903" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Frozen datasets and evaluation JSON</text><text x="934" y="944" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">data/benchmarks: questions, keys and source metadata</text><text x="934" y="974" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">data/evaluation: predictions, errors and metrics</text><text x="934" y="1004" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Gold keys are grading inputs only</text><text x="934" y="1034" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Separate task reports read by Evaluation Studio</text><rect x="628" y="687" width="508.9069969058037" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="635" y="710" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#52647B">Application reference: question_records[].question_id</text><text x="70" y="198" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#50627B">SQLITE: data/practice/practice.sqlite3</text><text x="70" y="825" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#50627B">OUTSIDE THE PRACTICE DATABASE</text><text x="60" y="1154" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">No learner table or SQL foreign key between questions and runs. Question references are inside JSON payloads.</text><text x="60" y="1182" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Source and policy govern reuse. Content hashes detect accidental edits, not malicious tampering.</text></svg>