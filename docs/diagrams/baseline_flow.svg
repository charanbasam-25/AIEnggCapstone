<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img"><title>The vanilla RAG comparison</title><desc>One retrieval and one answer call provide a reference for the cost and behaviour of verification. The historical baseline uses retrieved chunks and asks for a letter; it has no blind publication review. Saved keys grade correctness afterwards. Citing a page does not establish faithful reasoning.</desc><rect width="1500" height="860" fill="#F5F7FB"/><text x="60" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2457D6">UPSC PRACTICE / SYSTEM DESIGN</text><text x="1295" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">07 OCT 2026</text><text x="60" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#17243B">The vanilla RAG comparison</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">One retrieval and one answer call provide a reference for the cost and behaviour of verification.</text><path d="M 480,312 L 540,312" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="540,312 527.0,318.0 527.0,306.0" fill="#2457D6"/><path d="M 960,312 L 1020,312" fill="none" stroke="#0B806A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1020,312 1007.0,318.0 1007.0,306.0" fill="#0B806A"/><path d="M 1230,395 L 1230,565" fill="none" stroke="#7650B6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1230,565 1224.0,552.0 1236.0,552.0" fill="#7650B6"/><path d="M 1020,642 L 960,642" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="960,642 973.0,636.0 973.0,648.0" fill="#2457D6"/><path d="M 540,642 L 480,642" fill="none" stroke="#52647B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="480,642 493.0,636.0 493.0,648.0" fill="#52647B"/><rect x="60" y="230" width="420" height="190" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="230" width="5" height="190" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="84" y="268" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Question and A-D options</text><text x="84" y="309" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Combine the stem and</text><text x="84" y="340" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">alternatives</text><text x="84" y="371" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Keep the official answer out of</text><text x="84" y="402" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">the prompt</text><rect x="540" y="230" width="420" height="165" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="540" y="230" width="5" height="165" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="564" y="268" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Retrieve evidence</text><text x="564" y="309" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Semantic top 20</text><text x="564" y="340" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Cross-encoder rerank to top 5</text><rect x="1020" y="230" width="420" height="165" rx="16" fill="#F4F0FB" stroke="#DAE2EE" stroke-width="1.7"/><rect x="1020" y="230" width="5" height="165" rx="2" fill="#7650B6" stroke="#7650B6" stroke-width="1.7"/><text x="1044" y="268" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">One model answer call</text><text x="1044" y="309" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">gpt-4o-mini / temperature 0</text><text x="1044" y="340" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Choose an option and explain it</text><rect x="1020" y="565" width="420" height="180" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="1020" y="565" width="5" height="180" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="1044" y="603" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17243B">Record the prediction</text><text x="1044" y="640" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#50627B">Letter, explanation and retrieved text</text><text x="1044" y="666" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#50627B">No separate statement or option review</text><rect x="540" y="565" width="420" height="155" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="540" y="565" width="5" height="155" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="564" y="603" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Grade against saved keys</text><text x="564" y="644" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Correct or wrong, with errors</text><text x="564" y="674" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">separate</text><text x="564" y="704" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Same evaluation dataset</text><rect x="60" y="565" width="420" height="155" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="565" width="5" height="155" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="84" y="603" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Compare saved outcomes</text><text x="84" y="644" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Accuracy together with coverage</text><text x="84" y="674" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Reported as its own protocol</text><text x="60" y="784" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">The historical baseline uses retrieved chunks and asks for a letter; it has no blind publication review.</text><text x="60" y="812" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Saved keys grade correctness afterwards. Citing a page does not establish faithful reasoning.</text></svg>