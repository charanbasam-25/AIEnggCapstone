<svg xmlns="http://www.w3.org/2000/svg" width="1690" height="1540" viewBox="0 0 1690 1540" role="img"><title>How an answer is established or withheld</title><desc>Models assess evidence. Python validates citations and applies the final answer rule. INSUFFICIENT is unresolved evidence; it is never converted to a false statement in practice. Blind review hides the earlier verdict, but uses the same model family. Agreement can still be wrong.</desc><rect width="1690" height="1540" fill="#F5F7FB"/><text x="60" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2457D6">UPSC PRACTICE / SYSTEM DESIGN</text><text x="1485" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">07 OCT 2026</text><text x="60" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#17243B">How an answer is established or withheld</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Models assess evidence. Python validates citations and applies the final answer rule.</text><path d="M 1170,287 L 1260,287" fill="none" stroke="#A56B13" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1260,287 1247.0,293.0 1247.0,281.0" fill="#A56B13"/><path d="M 720,360 L 720,415 L 410,415 L 410,490" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="410,490 404.0,477.0 416.0,477.0" fill="#2457D6"/><path d="M 990,360 L 990,415 L 1280,415 L 1280,490" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1280,490 1274.0,477.0 1286.0,477.0" fill="#2457D6"/><path d="M 410,650 L 410,780" fill="none" stroke="#7650B6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="410,780 404.0,767.0 416.0,767.0" fill="#7650B6"/><path d="M 1280,650 L 1280,780" fill="none" stroke="#7650B6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1280,780 1274.0,767.0 1286.0,767.0" fill="#7650B6"/><path d="M 410,970 L 410,1100" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="410,1100 404.0,1087.0 416.0,1087.0" fill="#2457D6"/><path d="M 1280,970 L 1280,1100" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1280,1100 1274.0,1087.0 1286.0,1087.0" fill="#2457D6"/><path d="M 410,1260 L 410,1308 L 710,1308 L 710,1360" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="710,1360 704.0,1347.0 716.0,1347.0" fill="#2457D6"/><path d="M 1280,1260 L 1280,1308 L 1000,1308 L 1000,1360" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1000,1360 994.0,1347.0 1006.0,1347.0" fill="#2457D6"/><path d="M 1630,287 L 1660,287 L 1660,1402 L 1170,1402" fill="none" stroke="#A56B13" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><polygon points="1170,1402 1183.0,1396.0 1183.0,1408.0" fill="#A56B13"/><rect x="505" y="215" width="665" height="175" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="505" y="215" width="5" height="175" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="529" y="253" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Question text and A-D options</text><text x="529" y="294" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Python routes direct or numbered questions</text><text x="529" y="325" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Gold keys and earlier verdicts are withheld from</text><text x="529" y="356" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">reviewers</text><rect x="1260" y="215" width="370" height="145" rx="16" fill="#FFF7E8" stroke="#DAE2EE" stroke-width="1.7"/><rect x="1260" y="215" width="5" height="145" rx="2" fill="#A56B13" stroke="#A56B13" stroke-width="1.7"/><text x="1284" y="253" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17243B">Unsupported paired format</text><text x="1284" y="288" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">Statement-I/II or assertion/reason</text><text x="1284" y="313" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">Abstain before model retrieval</text><rect x="60" y="490" width="700" height="160" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="490" width="5" height="160" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="84" y="528" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Numbered statements: build complete claims</text><text x="84" y="569" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Parse stem, items, closing question and coded options</text><text x="84" y="600" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Bind the stem predicate; reject failed or introduced wording</text><rect x="930" y="490" width="700" height="160" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="930" y="490" width="5" height="160" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="954" y="528" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#17243B">Direct questions: prepare comparison evidence</text><text x="954" y="566" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Search the stem and each alternative</text><text x="954" y="594" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Deduplicate up to five selections per query; restore full pages</text><rect x="60" y="780" width="700" height="190" rx="16" fill="#F4F0FB" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="780" width="5" height="190" rx="2" fill="#7650B6" stroke="#7650B6" stroke-width="1.7"/><text x="84" y="818" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Assess each complete claim</text><text x="84" y="859" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Fresh retrieval plus full pages and named Article context</text><text x="84" y="890" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">SUPPORTED / CONTRADICTED / INSUFFICIENT</text><text x="84" y="921" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Validate quote references; blind review must agree</text><rect x="930" y="780" width="700" height="190" rx="16" fill="#F4F0FB" stroke="#DAE2EE" stroke-width="1.7"/><rect x="930" y="780" width="5" height="190" rx="2" fill="#7650B6" stroke="#7650B6" stroke-width="1.7"/><text x="954" y="818" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Assess the exact answer fit of A-D</text><text x="954" y="859" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">SUPPORTED / RULED_OUT / INSUFFICIENT</text><text x="954" y="890" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Validate quotes and screen wholly unrelated citations</text><text x="954" y="921" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Blind option review must resolve the same unique answer</text><rect x="60" y="1100" width="700" height="160" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="1100" width="5" height="160" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="84" y="1138" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Python strict statement mapping</text><text x="84" y="1179" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Resolved true and false statements form a truth pattern</text><text x="84" y="1210" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Map the pattern to one coded option; unresolved -&gt;</text><text x="84" y="1241" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">abstain</text><rect x="930" y="1100" width="700" height="160" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="930" y="1100" width="5" height="160" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="954" y="1138" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Python strict direct decision</text><text x="954" y="1179" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Exactly one SUPPORTED and three RULED_OUT</text><text x="954" y="1210" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Missing evidence cannot rule out an alternative</text><rect x="505" y="1360" width="665" height="85" rx="16" fill="#FFF7E8" stroke="#DAE2EE" stroke-width="1.7"/><rect x="505" y="1360" width="5" height="85" rx="2" fill="#A56B13" stroke="#A56B13" stroke-width="1.7"/><text x="529" y="1398" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#17243B">A-D with checked evidence, or ABSTAIN</text><rect x="419" y="701" width="151.69699960947037" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="426" y="724" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#7650B6">For each claim</text><rect x="1289" y="701" width="200.73199915885925" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="1296" y="724" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#7650B6">Compare all options</text><text x="60" y="1464" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">INSUFFICIENT is unresolved evidence; it is never converted to a false statement in practice.</text><text x="60" y="1492" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Blind review hides the earlier verdict, but uses the same model family. Agreement can still be wrong.</text></svg>