 sans-serif" font-size="29" font-weight="700" fill="#17243B">Make overlapping chunks</text><text x="564" y="299" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">1,000 characters / 150 overlap</text><text x="564" y="329" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">1,107 Constitution + 42 NCERT</text><text x="564" y="359" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Persist as JSONL with provenance</text><rect x="1020" y="220" width="420" height="180" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="1020" y="220" width="5" height="180" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="1044" y="258" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Build a local index</text><text x="1044" y="299" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">BAAI/bge-small-en-v1.5</text><text x="1044" y="329" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Normalized chunk embeddings</text><text x="1044" y="359" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">NumPy similarity search</text><rect x="60" y="520" width="420" height="185" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="520" width="5" height="185" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="84" y="558" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Build the query</text><text x="84" y="599" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Generation: topic + curated focus</text><text x="84" y="629" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Statements: each complete claim</text><text x="84" y="659" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Direct: stem and all four options</text><rect x="540" y="520" width="420" height="185" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="540" y="520" width="5" height="185" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="564" y="558" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Semantic search</text><text x="564" y="599" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Embed the query</text><text x="564" y="629" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Search the complete loaded index</text><text x="564" y="659" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Select the top 20 candidates</text><rect x="1020" y="520" width="420" height="185" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="1020" y="520" width="5" height="185" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="1044" y="558" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Cross-encoder reranking</text><text x="1044" y="599" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Score each query-passage pair</text><text x="1044" y="629" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">MS MARCO MiniLM-L-6-v2</text><text x="1044" y="659" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Keep the top 5 per query</text><rect x="60" y="900" width="420" height="180" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="900" width="5" height="180" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="84" y="938" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Named Article lookup</text><text x="84" y="979" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Find the actual provision heading</text><text x="84" y="1009" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Include continuation and notes</text><text x="84" y="1039" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Approved Constitution source only</text><rect x="540" y="900" width="420" height="180" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="540" y="900" width="5" height="180" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="564" y="938" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Restore source context</text><text x="564" y="979" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#50627B">Reassemble retrieved full pages</text><text x="564" y="1008" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#50627B">Retain qualifications and footnotes</text><text x="564" y="1037" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#50627B">Record added Article pages</text><text x="564" y="1066" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#50627B">separately</text><rect x="1020" y="900" width="420" height="180" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="1020" y="900" width="5" height="180" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="1044" y="938" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Quoted evidence packet</text><text x="1044" y="979" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#50627B">Numbered source excerpts</text><text x="1044" y="1006" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#50627B">Models select quotation references</text><text x="1044" y="1033" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#50627B">Python binds text, source and page</text><rect x="280" y="797" width="186.72499924898148" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="287" y="820" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B806A">Named references</text><rect x="831" y="774" width="185.56999909877777" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="838" y="797" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B806A">Ranked selections</text><text x="60" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#50627B">OFFLINE PREPARATION</text><text x="60" y="485" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#50627B">PER QUERY</text><text x="60" y="1164" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Article context adds source pages beside the ranking; it is used for generation and statement checks.</text><text x="60" y="1192" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Retrieval scores are ranking signals. A passage hit or an exact quote does not establish an answer.</text></svg>