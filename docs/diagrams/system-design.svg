<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1300" viewBox="0 0 1720 1300" role="img"><title>How the practice app fits together</title><desc>A local Streamlit app prepares questions from approved sources and records the work behind each set. Green: source data. Blue: Python and UI. Purple: model tasks. Grey: local storage. Automated reviews reduce risk. Accuracy of generated questions still needs independent expert evaluation.</desc><rect width="1720" height="1300" fill="#F5F7FB"/><text x="60" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2457D6">UPSC PRACTICE / SYSTEM DESIGN</text><text x="1515" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">07 OCT 2026</text><text x="60" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#17243B">How the practice app fits together</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">A local Streamlit app prepares questions from approved sources and records the work behind each set.</text><path d="M 540,300 L 620,300" fill="none" stroke="#0B806A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="620,300 607.0,306.0 607.0,294.0" fill="#0B806A"/><path d="M 1100,300 L 1180,300" fill="none" stroke="#0B806A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1180,300 1167.0,306.0 1167.0,294.0" fill="#0B806A"/><path d="M 1420,385 L 1420,495" fill="none" stroke="#0B806A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1420,495 1414.0,482.0 1426.0,482.0" fill="#0B806A"/><path d="M 540,582 L 620,582" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="620,582 607.0,588.0 607.0,576.0" fill="#2457D6"/><polygon points="540,582 553.0,576.0 553.0,588.0" fill="#2457D6"/><path d="M 1100,582 L 1180,582" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1180,582 1167.0,588.0 1167.0,576.0" fill="#2457D6"/><polygon points="1100,582 1113.0,576.0 1113.0,588.0" fill="#2457D6"/><path d="M 300,670 L 300,785" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="300,785 294.0,772.0 306.0,772.0" fill="#2457D6"/><path d="M 860,670 L 860,785" fill="none" stroke="#52647B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="860,785 854.0,772.0 866.0,772.0" fill="#52647B"/><polygon points="860,670 866.0,683.0 854.0,683.0" fill="#52647B"/><path d="M 1420,670 L 1420,785" fill="none" stroke="#7650B6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><polygon points="1420,785 1414.0,772.0 1426.0,772.0" fill="#7650B6"/><polygon points="1420,670 1426.0,683.0 1414.0,683.0" fill="#7650B6"/><path d="M 860,975 L 860,1090" fill="none" stroke="#52647B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="860,1090 854.0,1077.0 866.0,1077.0" fill="#52647B"/><rect x="60" y="215" width="480" height="170" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="215" width="5" height="170" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="84" y="253" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Public source PDFs</text><text x="84" y="294" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Constitution of India</text><text x="84" y="325" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Selected NCERT Grade 7 chapter</text><text x="84" y="356" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Extract pages and retain provenance</text><rect x="620" y="215" width="480" height="170" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="620" y="215" width="5" height="170" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="644" y="253" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Page-aware corpus</text><text x="644" y="294" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">1,149 chunks / chunks.jsonl</text><text x="644" y="324" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Source, document, page and chunk ID</text><text x="644" y="354" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">SHA-256 identifies the snapshot</text><rect x="1180" y="215" width="480" height="170" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="1180" y="215" width="5" height="170" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="1204" y="253" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Local retrieval</text><text x="1204" y="294" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">BGE embeddings / NumPy index</text><text x="1204" y="324" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Semantic 20 -&gt; reranked 5 per query</text><text x="1204" y="354" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Full pages and named Article context</text><rect x="60" y="495" width="480" height="175" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="495" width="5" height="175" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="84" y="533" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Streamlit learner UI</text><text x="84" y="574" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Practice / My Practice / How it works</text><text x="84" y="605" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Topic, style, level and set size</text><text x="84" y="636" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Keys and notes appear on Submit</text><rect x="620" y="495" width="480" height="175" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="620" y="495" width="5" height="175" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="644" y="533" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Practice service</text><text x="644" y="574" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Validate the bounded request</text><text x="644" y="605" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Reuse eligible records or fill slots</text><text x="644" y="636" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Return accepted items or a partial set</text><rect x="1180" y="495" width="480" height="175" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="1180" y="495" width="5" height="175" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="1204" y="533" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Bounded LangGraph workflow</text><text x="1204" y="574" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Draft -&gt; verify -&gt; audit -&gt; explain</text><text x="1204" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Five required publication gates</text><text x="1204" y="634" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">At most two MCQ revisions</text><rect x="60" y="785" width="480" height="190" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="785" width="5" height="190" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="84" y="823" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Session history</text><text x="84" y="864" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Answers and scores in server memory</text><text x="84" y="894" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Latest 20 completed sets</text><text x="84" y="924" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Python scoring; no model call</text><text x="84" y="954" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">No persistent learner accounts</text><rect x="620" y="785" width="480" height="190" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="620" y="785" width="5" height="190" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="644" y="823" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Local SQLite store</text><text x="644" y="864" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Accepted MCQs and source-bound notes</text><text x="644" y="892" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Runs, retrieval traces and usage</text><text x="644" y="920" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Source + policy must match for reuse</text><text x="644" y="948" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Shared store; no account isolation</text><rect x="1180" y="785" width="480" height="190" rx="16" fill="#F4F0FB" stroke="#DAE2EE" stroke-width="1.7"/><rect x="1180" y="785" width="5" height="190" rx="2" fill="#7650B6" stroke="#7650B6" stroke-width="1.7"/><text x="1204" y="823" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">OpenAI model tasks</text><text x="1204" y="864" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">gpt-4o-mini / structured responses</text><text x="1204" y="894" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Generator and separate reviewers</text><text x="1204" y="924" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">45-second timeout / one SDK retry</text><text x="1204" y="954" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Reviews can share model errors</text><rect x="60" y="1090" width="1600" height="110" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="1090" width="5" height="110" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="84" y="1128" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">How it works: saved diagnostics</text><text x="84" y="1169" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Evaluation JSON + practice run reports -&gt; Evals, RAG, guardrails, cost and latency. Viewing makes no model calls.</text><rect x="1427" y="427" width="100.3729994893074" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="1434" y="450" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B806A">Evidence</text><rect x="872" y="715" width="136.55599927902222" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="879" y="738" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#52647B">Reuse / save</text><rect x="1428" y="715" width="158.71099942922592" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="1435" y="738" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#7650B6">Structured calls</text><rect x="872" y="1017" width="144.72499924898148" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="879" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#52647B">Saved reports</text><text x="60" y="1224" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Green: source data. Blue: Python and UI. Purple: model tasks. Grey: local storage.</text><text x="60" y="1252" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Automated reviews reduce risk. Accuracy of generated questions still needs independent expert evaluation.</text></svg>