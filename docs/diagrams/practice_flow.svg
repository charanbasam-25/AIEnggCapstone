<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1300" viewBox="0 0 1500 1300" role="img"><title>The learner&#x27;s practice flow</title><desc>Preparation checks happen before the quiz. Study results and project diagnostics have separate views. Changing sources retires the active set. Sidebar navigation preserves an unfinished quiz. Difficulty is a requested prompt setting. Learner history lasts for the current server session.</desc><rect width="1500" height="1300" fill="#F5F7FB"/><text x="60" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2457D6">UPSC PRACTICE / SYSTEM DESIGN</text><text x="1295" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">07 OCT 2026</text><text x="60" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#17243B">The learner&#x27;s practice flow</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Preparation checks happen before the quiz. Study results and project diagnostics have separate views.</text><path d="M 660,295 L 860,295" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="860,295 847.0,301.0 847.0,289.0" fill="#2457D6"/><path d="M 1150,370 L 1150,515" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1150,515 1144.0,502.0 1156.0,502.0" fill="#2457D6"/><path d="M 860,330 L 760,330 L 760,440 L 360,440 L 360,515" fill="none" stroke="#52647B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="360,515 354.0,502.0 366.0,502.0" fill="#52647B"/><path d="M 860,595 L 660,595" fill="none" stroke="#0B806A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="660,595 673.0,589.0 673.0,601.0" fill="#0B806A"/><path d="M 1150,675 L 1150,790" fill="none" stroke="#A56B13" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1150,790 1144.0,777.0 1156.0,777.0" fill="#A56B13"/><path d="M 360,675 L 360,790" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="360,790 354.0,777.0 366.0,777.0" fill="#2457D6"/><path d="M 360,930 L 360,1050" fill="none" stroke="#0B806A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="360,1050 354.0,1037.0 366.0,1037.0" fill="#0B806A"/><path d="M 660,1125 L 860,1125" fill="none" stroke="#52647B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="860,1125 847.0,1131.0 847.0,1119.0" fill="#52647B"/><rect x="60" y="220" width="600" height="150" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="220" width="5" height="150" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="84" y="258" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Choose a practice set</text><text x="84" y="299" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Polity topic / direct, statements or mixed</text><text x="84" y="330" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Foundation, Standard or Challenging / 1, 5 or 10</text><rect x="860" y="220" width="580" height="150" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="860" y="220" width="5" height="150" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="884" y="258" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Look for eligible checked items</text><text x="884" y="299" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Match topic, style, level, source hash and policy</text><text x="884" y="329" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Validate the saved payload before reuse</text><rect x="60" y="515" width="600" height="160" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="515" width="5" height="160" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="84" y="553" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Attempt the accepted questions</text><text x="84" y="594" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Choose A-D or leave an item unanswered</text><text x="84" y="625" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">No answer key or option notes before submission</text><rect x="860" y="515" width="580" height="160" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="860" y="515" width="5" height="160" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="884" y="553" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Prepare the remaining slots</text><text x="884" y="594" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Retrieve sources, draft and run every gate</text><text x="884" y="624" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Revise within the limit; withhold failed drafts</text><rect x="60" y="790" width="600" height="140" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="790" width="5" height="140" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="84" y="828" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Submit the quiz</text><text x="84" y="869" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Python compares choices with the checked key</text><text x="84" y="900" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Correct / incorrect / skipped</text><rect x="860" y="790" width="580" height="150" rx="16" fill="#FFF7E8" stroke="#DAE2EE" stroke-width="1.7"/><rect x="860" y="790" width="5" height="150" rx="2" fill="#A56B13" stroke="#A56B13" stroke-width="1.7"/><text x="884" y="828" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Show the preparation outcome</text><text x="884" y="869" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Partial set: use only accepted questions</text><text x="884" y="899" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Empty set: explain why no quiz is available</text><rect x="60" y="1050" width="600" height="150" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="1050" width="5" height="150" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="84" y="1088" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Review answers and sources</text><text x="84" y="1129" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Summary and explanations for every option</text><text x="84" y="1160" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Exact quotations with source PDF pages</text><rect x="860" y="1050" width="580" height="150" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="860" y="1050" width="5" height="150" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="884" y="1088" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">My Practice</text><text x="884" y="1129" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Recent completed sets and a mistake notebook</text><text x="884" y="1160" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Revisit incorrect or skipped items</text><rect x="1161" y="427" width="134.1829997897148" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="1168" y="450" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2457D6">Missing slots</text><rect x="391" y="409" width="140.04199945926666" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="398" y="432" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#52647B">Eligible reuse</text><rect x="675" y="555" width="157.55599927902222" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="682" y="578" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B806A">Accepted items</text><text x="60" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#50627B">LEARNER</text><text x="860" y="190" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#50627B">PREPARATION SERVICE</text><text x="60" y="1224" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Changing sources retires the active set. Sidebar navigation preserves an unfinished quiz.</text><text x="60" y="1252" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Difficulty is a requested prompt setting. Learner history lasts for the current server session.</text></svg>