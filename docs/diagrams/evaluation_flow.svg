<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1320" viewBox="0 0 1640 1320" role="img"><title>How evaluation results reach the dashboard</title><desc>Answering and grading are separate. Every saved result belongs to a specific task and protocol. 75 mixed regression questions, 13 legacy cases and 16 retrieval queries have different units and references. Generated-MCQ gate yield is measurable; expert-reviewed key and explanation accuracy is still unmeasured.</desc><rect width="1640" height="1320" fill="#F5F7FB"/><text x="60" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2457D6">UPSC PRACTICE / SYSTEM DESIGN</text><text x="1435" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">07 OCT 2026</text><text x="60" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#17243B">How evaluation results reach the dashboard</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Answering and grading are separate. Every saved result belongs to a specific task and protocol.</text><path d="M 385,380 L 385,525" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="385,525 379.0,512.0 391.0,512.0" fill="#2457D6"/><path d="M 710,597 L 950,597" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="950,597 937.0,603.0 937.0,591.0" fill="#2457D6"/><path d="M 1265,380 L 1265,525" fill="none" stroke="#52647B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1265,525 1259.0,512.0 1271.0,512.0" fill="#52647B"/><path d="M 1265,670 L 1265,820" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1265,820 1259.0,807.0 1271.0,807.0" fill="#2457D6"/><path d="M 710,287 L 828,287 L 828,858 L 950,858" fill="none" stroke="#A56B13" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><polygon points="950,858 937.0,864.0 937.0,852.0" fill="#A56B13"/><path d="M 950,925 L 710,925" fill="none" stroke="#52647B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="710,925 723.0,919.0 723.0,931.0" fill="#52647B"/><path d="M 385,975 L 385,1110" fill="none" stroke="#52647B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="385,1110 379.0,1097.0 391.0,1097.0" fill="#52647B"/><path d="M 950,1167 L 710,1167" fill="none" stroke="#52647B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="710,1167 723.0,1161.0 723.0,1173.0" fill="#52647B"/><rect x="60" y="225" width="650" height="155" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="225" width="5" height="155" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="84" y="263" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Frozen question dataset</text><text x="84" y="304" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Question text, options and source provenance</text><text x="84" y="335" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Official keys retained for Python grading only</text><rect x="950" y="225" width="630" height="155" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="950" y="225" width="5" height="155" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="974" y="263" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Recorded run configuration</text><text x="974" y="304" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Dataset, corpus and code hashes</text><text x="974" y="334" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Model, temperature, split, systems and retrieval</text><text x="974" y="364" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">depths</text><rect x="60" y="525" width="650" height="145" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="525" width="5" height="145" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="84" y="563" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Answering input</text><text x="84" y="604" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Stem and options only</text><text x="84" y="635" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">No official key, label audit or diagnostic worksheet</text><rect x="950" y="525" width="630" height="145" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="950" y="525" width="5" height="145" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="974" y="563" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Run the selected answering systems</text><text x="974" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Strict verifier and/or vanilla RAG</text><text x="974" y="634" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Save evidence, predicted letter or abstention</text><rect x="60" y="820" width="650" height="155" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="820" width="5" height="155" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="84" y="858" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Write a resumable JSON checkpoint</text><text x="84" y="899" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Save after each system/question result</text><text x="84" y="930" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Resume only when configuration matches</text><rect x="950" y="820" width="630" height="155" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="950" y="820" width="5" height="155" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="974" y="858" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Grade predictions in Python</text><text x="974" y="899" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Correct / wrong / abstained / service error</text><text x="974" y="929" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Precision, coverage, accuracy and breakdowns</text><rect x="60" y="1110" width="650" height="115" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="1110" width="5" height="115" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="84" y="1148" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">How it works -&gt; Evals</text><text x="84" y="1189" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Validate and read saved reports; inspect or export</text><rect x="950" y="1110" width="630" height="115" rx="16" fill="#FFFFFF" stroke="#DAE2EE" stroke-width="1.7"/><rect x="950" y="1110" width="5" height="115" rx="2" fill="#52647B" stroke="#52647B" stroke-width="1.7"/><text x="974" y="1148" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Other task-specific reports</text><text x="974" y="1189" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Retrieval, legacy judge/stability and generation yield</text><rect x="397" y="441" width="152.89399921894073" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="404" y="464" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2457D6">Questions only</text><rect x="840" y="735" width="186.7459989786148" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="847" y="758" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#A56B13">Keys: grading only</text><rect x="398" y="1034" width="120.23899906873703" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="405" y="1057" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#52647B">Saved data</text><text x="60" y="1244" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">75 mixed regression questions, 13 legacy cases and 16 retrieval queries have different units and references.</text><text x="60" y="1272" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Generated-MCQ gate yield is measurable; expert-reviewed key and explanation accuracy is still unmeasured.</text></svg>