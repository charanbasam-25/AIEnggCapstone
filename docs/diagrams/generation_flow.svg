<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1410" viewBox="0 0 1680 1410" role="img"><title>A bounded draft, review and publication loop</title><desc>Each changed candidate starts with cleared gate results. Only an accepted record reaches the learner. Failed format checks skip answer work. Invalid answers skip quality calls; failed quality skips notes. One initial draft + two MCQ revisions. Explanation writing has one local repair; SDK retries are separate.</desc><rect width="1680" height="1410" fill="#F5F7FB"/><text x="60" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2457D6">UPSC PRACTICE / SYSTEM DESIGN</text><text x="1475" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">07 OCT 2026</text><text x="60" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#17243B">A bounded draft, review and publication loop</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Each changed candidate starts with cleared gate results. Only an accepted record reaches the learner.</text><path d="M 395,370 L 395,465" fill="none" stroke="#0B806A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="395,465 389.0,452.0 401.0,452.0" fill="#0B806A"/><path d="M 395,615 L 395,710" fill="none" stroke="#7650B6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="395,710 389.0,697.0 401.0,697.0" fill="#7650B6"/><path d="M 395,860 L 395,955" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="395,955 389.0,942.0 401.0,942.0" fill="#2457D6"/><path d="M 720,1042 L 840,1042 L 840,295 L 960,295" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="960,295 947.0,301.0 947.0,289.0" fill="#2457D6"/><path d="M 1285,370 L 1285,465" fill="none" stroke="#7650B6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1285,465 1279.0,452.0 1291.0,452.0" fill="#7650B6"/><path d="M 1285,640 L 1285,735" fill="none" stroke="#7650B6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1285,735 1279.0,722.0 1291.0,722.0" fill="#7650B6"/><path d="M 1110,910 L 1110,1050" fill="none" stroke="#0B806A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1110,1050 1104.0,1037.0 1116.0,1037.0" fill="#0B806A"/><path d="M 1460,910 L 1460,1050" fill="none" stroke="#A56B13" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1460,1050 1454.0,1037.0 1466.0,1037.0" fill="#A56B13"/><path d="M 1610,822 L 1640,822 L 1640,1270 L 28,1270 L 28,540 L 70,540" fill="none" stroke="#A56B13" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><polygon points="70,540 57.0,546.0 57.0,534.0" fill="#A56B13"/><rect x="70" y="220" width="650" height="150" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="70" y="220" width="5" height="150" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="94" y="258" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#17243B">1 Retrieve generation sources</text><text x="94" y="296" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Topic and curated focus -&gt; top 20 -&gt; reranked 5</text><text x="94" y="324" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Full pages, named Article context and source provenance</text><rect x="70" y="465" width="650" height="150" rx="16" fill="#F4F0FB" stroke="#DAE2EE" stroke-width="1.7"/><rect x="70" y="465" width="5" height="150" rx="2" fill="#7650B6" stroke="#7650B6" stroke-width="1.7"/><text x="94" y="503" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#17243B">2 Generate a structured candidate</text><text x="94" y="541" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Question, four options and a proposed key</text><text x="94" y="569" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Use source packet, requested style and revision feedback</text><rect x="70" y="710" width="650" height="150" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="70" y="710" width="5" height="150" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="94" y="748" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#17243B">3 Check format and construct claims</text><text x="94" y="786" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Nonempty, distinct options; supported question structure</text><text x="94" y="814" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Exact-stem duplicate check; safe deterministic binding</text><rect x="70" y="955" width="650" height="175" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="70" y="955" width="5" height="175" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="94" y="993" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#17243B">4 Verify claims and the answer</text><text x="94" y="1031" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Fresh claim retrieval OR direct stem-plus-options retrieval</text><text x="94" y="1059" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Quote validation and agreeing blind review</text><text x="94" y="1087" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Python resolves a unique key and compares the proposed</text><text x="94" y="1115" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">key</text><rect x="960" y="220" width="650" height="150" rx="16" fill="#F4F0FB" stroke="#DAE2EE" stroke-width="1.7"/><rect x="960" y="220" width="5" height="150" rx="2" fill="#7650B6" stroke="#7650B6" stroke-width="1.7"/><text x="984" y="258" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">5 Audit question quality</text><text x="984" y="299" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Clarity, single best answer, distractors, wording, topic</text><text x="984" y="330" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Every flag true, PASS and no issues</text><rect x="960" y="465" width="650" height="175" rx="16" fill="#F4F0FB" stroke="#DAE2EE" stroke-width="1.7"/><rect x="960" y="465" width="5" height="175" rx="2" fill="#7650B6" stroke="#7650B6" stroke-width="1.7"/><text x="984" y="503" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17243B">6 Write and review learning notes</text><text x="984" y="540" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#50627B">Replace generator prose with fresh summary and A-D notes</text><text x="984" y="566" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#50627B">Bind source excerpts; review every item against its citations</text><text x="984" y="592" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#50627B">All item and global explanation checks must pass</text><rect x="960" y="735" width="650" height="175" rx="16" fill="#FFF7E8" stroke="#DAE2EE" stroke-width="1.7"/><rect x="960" y="735" width="5" height="175" rx="2" fill="#A56B13" stroke="#A56B13" stroke-width="1.7"/><text x="984" y="773" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">7 Python publication decision</text><text x="984" y="814" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Sources + format + answer + quality + explanations</text><text x="984" y="845" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">All current-attempt gates must PASS</text><text x="984" y="876" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">ACCEPT / REVISE / REJECT</text><rect x="960" y="1050" width="300" height="155" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="960" y="1050" width="5" height="155" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="984" y="1088" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17243B">ACCEPT</text><text x="984" y="1124" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#50627B">Recheck at service</text><text x="984" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#50627B">boundary</text><text x="984" y="1176" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#50627B">Validate and store the item</text><rect x="1310" y="1050" width="300" height="155" rx="16" fill="#FFF7E8" stroke="#DAE2EE" stroke-width="1.7"/><rect x="1310" y="1050" width="5" height="155" rx="2" fill="#A56B13" stroke="#A56B13" stroke-width="1.7"/><text x="1334" y="1088" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#17243B">REJECT</text><text x="1334" y="1124" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#50627B">No failed draft in the quiz</text><text x="1334" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#50627B">Partial set or empty result</text><rect x="1121" y="975" width="87.52099972963333" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="1128" y="998" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B806A">All pass</text><rect x="1469" y="975" width="110.89399921894073" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="1476" y="998" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#A56B13">No budget</text><rect x="378" y="1239" width="819.3499954938889" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="385" y="1262" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#A56B13">REVISE: at most twice; keep generation evidence, retrieve verification evidence afresh</text><text x="60" y="1334" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Failed format checks skip answer work. Invalid answers skip quality calls; failed quality skips notes.</text><text x="60" y="1362" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">One initial draft + two MCQ revisions. Explanation writing has one local repair; SDK retries are separate.</text></svg>