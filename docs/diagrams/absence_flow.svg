<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1260" viewBox="0 0 1500 1260" role="img"><title>The special case: literal absence of a term</title><desc>A limited Python scan handles recognised quoted-term patterns. Other propositions use semantic verification. The scan covers the combined loaded corpus, uses substrings and normalizes case/whitespace. Scope is a limitation. Practice also requires cited blind review. A lexical-scan result lacks that marker and is currently withheld.</desc><rect width="1500" height="1260" fill="#F5F7FB"/><text x="60" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#2457D6">UPSC PRACTICE / SYSTEM DESIGN</text><text x="1295" y="43" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">07 OCT 2026</text><text x="60" y="104" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#17243B">The special case: literal absence of a term</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">A limited Python scan handles recognised quoted-term patterns. Other propositions use semantic verification.</text><path d="M 680,300 L 860,300" fill="none" stroke="#2457D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="860,300 847.0,306.0 847.0,294.0" fill="#2457D6"/><path d="M 860,340 L 765,340 L 765,475 L 370,475 L 370,600" fill="none" stroke="#7650B6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="370,600 364.0,587.0 376.0,587.0" fill="#7650B6"/><path d="M 1150,380 L 1150,600" fill="none" stroke="#0B806A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1150,600 1144.0,587.0 1156.0,587.0" fill="#0B806A"/><path d="M 1030,785 L 1030,893 L 932,893 L 932,1000" fill="none" stroke="#A56B13" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="932,1000 926.0,987.0 938.0,987.0" fill="#A56B13"/><path d="M 1270,785 L 1270,893 L 1287,893 L 1287,1000" fill="none" stroke="#A56B13" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1287,1000 1281.0,987.0 1293.0,987.0" fill="#A56B13"/><rect x="60" y="220" width="620" height="160" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="220" width="5" height="160" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="84" y="258" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">A complete constructed claim</text><text x="84" y="299" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Example: The Constitution does not mention</text><text x="84" y="330" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">the term &quot;political party&quot;.</text><rect x="860" y="220" width="580" height="160" rx="16" fill="#EFF4FE" stroke="#DAE2EE" stroke-width="1.7"/><rect x="860" y="220" width="5" height="160" rx="2" fill="#2457D6" stroke="#2457D6" stroke-width="1.7"/><text x="884" y="258" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Recognised quoted absence pattern?</text><text x="884" y="299" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Only explicit forms implemented in Python</text><text x="884" y="329" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">A concept or ordinary statement is not a lexical</text><text x="884" y="359" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">absence test</text><rect x="60" y="600" width="620" height="185" rx="16" fill="#F4F0FB" stroke="#DAE2EE" stroke-width="1.7"/><rect x="60" y="600" width="5" height="185" rx="2" fill="#7650B6" stroke="#7650B6" stroke-width="1.7"/><text x="84" y="638" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Normal evidence-based verification</text><text x="84" y="679" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Retrieve and interpret the complete proposition</text><text x="84" y="710" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">Validate source quotes and require blind review</text><text x="84" y="741" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#50627B">A word match does not establish the claim</text><rect x="860" y="600" width="580" height="185" rx="16" fill="#EDF8F4" stroke="#DAE2EE" stroke-width="1.7"/><rect x="860" y="600" width="5" height="185" rx="2" fill="#0B806A" stroke="#0B806A" stroke-width="1.7"/><text x="884" y="638" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#17243B">Scan every loaded corpus chunk</text><text x="884" y="679" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">No model call inside the scan branch</text><text x="884" y="709" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Record matching chunks, pages and chunks</text><text x="884" y="739" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">scanned</text><text x="884" y="769" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#50627B">Counts can include overlapping chunk matches</text><rect x="780" y="1000" width="305" height="155" rx="16" fill="#FFF7E8" stroke="#DAE2EE" stroke-width="1.7"/><rect x="780" y="1000" width="5" height="155" rx="2" fill="#A56B13" stroke="#A56B13" stroke-width="1.7"/><text x="804" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#17243B">Term found</text><text x="804" y="1073" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">Literal absence contradicted</text><text x="804" y="1098" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">Return matching source</text><text x="804" y="1123" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50627B">chunks</text><rect x="1135" y="1000" width="305" height="155" rx="16" fill="#FFF7E8" stroke="#DAE2EE" stroke-width="1.7"/><rect x="1135" y="1000" width="5" height="155" rx="2" fill="#A56B13" stroke="#A56B13" stroke-width="1.7"/><text x="1159" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#17243B">No match</text><text x="1159" y="1071" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#50627B">Conditional corpus-only support</text><text x="1159" y="1093" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#50627B">Assumes complete, faithful text</text><rect x="385" y="444" width="191.36599957942963" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="392" y="467" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#7650B6">No: semantic claim</text><rect x="1159" y="473" width="229.92199885845184" height="31" rx="4" fill="#F5F7FB" stroke="#F5F7FB" stroke-width="1.7"/><text x="1166" y="496" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#0B806A">Yes: literal quoted term</text><text x="60" y="1184" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">The scan covers the combined loaded corpus, uses substrings and normalizes case/whitespace. Scope is a limitation.</text><text x="60" y="1212" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#50627B">Practice also requires cited blind review. A lexical-scan result lacks that marker and is currently withheld.</text></svg>